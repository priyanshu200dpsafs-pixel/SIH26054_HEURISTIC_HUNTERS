[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-engine-digital-twin"
version = "0.3.0"
description = "Explainable Digital Twin for MALE UAV Aero Piston Powerplant (Rotax 912-class)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "UAV Digital Twin Team" }
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "python-can>=4.2.0",
    "cantools>=39.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
